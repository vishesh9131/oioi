name: Release

# Build native installers for macOS, Windows and Linux.
# Trigger by pushing a tag like v0.4.0, or run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            run: npm run dist          # -> release/oioi-*-universal.dmg (ad-hoc signed)
          - os: windows-latest
            run: npm run dist:win       # -> release/*.exe (nsis + portable)
          - os: ubuntu-latest
            run: npm run dist:linux     # -> release/*.AppImage + *.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installer
        run: ${{ matrix.run }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oioi-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
